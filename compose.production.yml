services:
  simple-budget:
    container_name: simple-budget
    build:
      dockerfile: prod.Dockerfile
      context: .
      args:
        - DATABASE_URL=${DATABASE_URL}
    env_file: .env
    ports:
      - "3035:3000"
    restart: unless-stopped
    network_mode: bridge
    volumes:
      - ./database.db:/app/database.db
